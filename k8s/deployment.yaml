apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipkit-deployment
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shipkit-app

  template:
    metadata:
      labels:
        app: shipkit-app

    spec:
      containers:
        - name: app
          image: ghcr.io/callmedenz/shipkit:latest
          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"